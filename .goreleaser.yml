env:
  - GO111MODULE=on
before:
  hooks:
    - go mod tidy
builds:
  - binary: deckmaster
    flags:
      - -trimpath
    ldflags: -s -w -X main.Version={{ .Version }} -X main.CommitSHA={{ .Commit }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - 386
      - arm
    goarm:
      - 6
      - 7
  # Note: darwin builds require a macOS runner due to CGo cross-compilation constraints.
  # Build this target using goreleaser on a macOS CI runner.
  - id: darwin
    binary: deckmaster
    flags:
      - -trimpath
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
    ldflags: -s -w -X main.Version={{ .Version }} -X main.CommitSHA={{ .Commit }}

archives:
  - replacements:
      386: i386
      amd64: x86_64

nfpms:
  - builds:
      - deckmaster
    vendor: muesli
    homepage: "https://fribbledom.com/"
    maintainer: "Christian Muehlhaeuser <muesli@gmail.com>"
    description: "An application to control your Elgato Stream Deck"
    license: MIT
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin

